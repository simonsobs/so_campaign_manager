name: monkey

on:
  schedule:
    - cron: "17 7 * * 1"          # weekly, Monday 07:17 UTC
  workflow_dispatch:
    inputs:
      target: { description: "Number of mutants", default: "25" }

permissions:
  contents: read        # the agent can never push code
  issues: write         # only used to open tickets for surviving mutants

concurrency: { group: monkey, cancel-in-progress: false }

jobs:
  monkey:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}    # PAT with Copilot Requests permission
      TARGET:   ${{ inputs.target || '25' }}
      OWNER:    ${{ vars.MONKEY_OWNER }}                  # your GitHub handle
      TEST_CMD: ${{ vars.MONKEY_TEST_CMD }}               # e.g. "uv run pytest -q"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }

      - name: Ensure labels exist
        run: |
          gh label create "monkey:finding"      --color 8B5CF6 --description "Surviving mutant found by the monkey" --force
          gh label create "severity:should-fix" --color D73A4A --description "Untested auth/validation/data/money logic" --force
          gh label create "severity:nit"        --color FBCA04 --description "Minor untested behavior" --force

      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras

      - name: Unleash the monkey
        run: |
          mkdir -p monkey-logs
          npm i -g @github/copilot
          copilot --agent monkey \
            -p "TARGET=$TARGET OWNER=$OWNER TEST_CMD='$TEST_CMD'. Follow your instructions." \
            --allow-all-tools \
            --deny-tool 'shell(git push)' \
            --deny-tool 'shell(git commit)' \
            --deny-tool 'shell(git reset)' \
            --deny-tool 'shell(gh pr create)' \
            --deny-tool 'shell(gh issue comment)' \
            --deny-tool 'shell(gh issue edit)'

      - name: Report to job summary
        if: always()
        run: cat monkey-logs/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Guard — tree must be clean
        if: always()
        run: |
          if git status --porcelain | grep -v '^?? monkey-logs/'; then
            echo "::error::Monkey left the tree dirty"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: monkey-logs, path: monkey-logs/ }
